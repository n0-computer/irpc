[package]
name = "irpc"
version = "0.17.0"
edition = "2024"
authors = ["Rüdiger Klaehn <rklaehn@protonmail.com>", "n0 team"]
keywords = ["api", "protocol", "network", "rpc"]
categories = ["network-programming"]
license = "Apache-2.0/MIT"
repository = "https://github.com/n0-computer/irpc"
description = "A streaming rpc system based on quic"

# Sadly this also needs to be updated in .github/workflows/ci.yml
rust-version = "1.91"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
# we require serde even in non-rpc mode
serde = { workspace = true }
# just for the oneshot and mpsc queues, and tokio::select!
tokio = { workspace = true, features = ["sync", "macros"] }
# for PollSender (which for some reason is not available in the main tokio api)
tokio-util = { version = "0.7.14", default-features = false }
# errors
n0-error = { workspace = true }

# used in the endpoint handler code when using rpc
tracing = { workspace = true, optional = true }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry"], optional = true }
# used to ser/de messages when using rpc
postcard = { workspace = true, features = ["alloc", "use-std"], optional = true }
# currently only transport when using rpc
noq = { workspace = true, optional = true }
# used as a buffer for serialization when using rpc
smallvec = { version = "1.14.0", features = ["write"], optional = true }
# used in the test utils to generate noq endpoints
rustls = { version = "0.23.5", default-features = false, features = ["std"], optional = true }
# used in the test utils to generate noq endpoints
rcgen = { version = "0.14.5", optional = true }
# used in the benches
futures-buffered ={ version = "0.2.9", optional = true }
# for AbortOnDropHandle
n0-future = { workspace = true }
futures-util = { workspace = true, optional = true }
# for the derive reexport/feature
irpc-derive = { version = "0.17.0", path = "./irpc-derive", optional = true }
# used for the iroh transport
iroh = { workspace = true, optional = true }
portable-atomic = { version = "1", optional = true }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"], optional = true }

[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
noq = { workspace = true, optional = true, features = ["runtime-tokio"] }

[dev-dependencies]
tracing-subscriber = { workspace = true, features = ["fmt"] }
# pin lazy_static minimum for -Z minimal-versions compatibility (sharded-slab needs >= 1.4)
lazy_static = { version = "1.4" }
# pin num-traits minimum for -Z minimal-versions compatibility (prefix-trie via hickory-proto needs the u128 impls)
num-traits = { version = "0.2.14" }
# just convenient for the enum definitions, in the manual example
derive_more = { version = "2", features = ["from"] }
# we need full for example main etc.
tokio = { workspace = true, features = ["full"] }
# formatting
thousands = "0.2.0"
# macro tests
trybuild = "1.0.104"
testresult = "0.4.1"
# used in examples
anyhow = { workspace = true }
# Tests and examples need a crypto provider, which iroh's default features supply.
iroh = { workspace = true, default-features = true }
n0-future = { workspace = true }
clap = { version = "4.5.41", features = ["derive"] }
futures-util.workspace = true
hex = "0.4.3"
rand = "0.10.3"
n0-tracing-test = "0.3.0"

[features]
# enable the remote transport
rpc = ["dep:noq", "dep:postcard", "dep:smallvec", "dep:tracing", "tokio/io-util"]
# propagate span context to the remote with a `span_propagation::layer`
span-propagation = ["rpc", "dep:tracing-subscriber", "tokio/rt"]
# enable the iroh transport
iroh = ["rpc", "dep:iroh", "dep:portable-atomic", "dep:getrandom"]
# add helpers to create noq endpoints, for tests and for rpc on localhost
noq_endpoint_setup = ["rpc", "dep:rustls", "dep:rcgen", "dep:futures-buffered", "noq/rustls-ring"]
# pick up parent span when creating channel messages
spans = ["dep:tracing"]
stream = ["dep:futures-util"]
derive = ["dep:irpc-derive"]
varint-util = ["dep:postcard", "dep:smallvec", "tokio/io-util"]
default = ["rpc", "iroh", "spans", "stream", "derive"]

[[example]]
name = "derive"
required-features = ["rpc", "derive", "noq_endpoint_setup"]

[[example]]
name = "compute"
required-features = ["rpc", "derive", "noq_endpoint_setup"]

[[example]]
name = "local"
required-features = ["derive"]

[[example]]
name = "storage"
required-features = ["rpc", "noq_endpoint_setup"]

[[example]]
name = "0rtt"
required-features = ["iroh", "spans", "stream", "derive"]

[[example]]
name = "auth"
required-features = ["iroh", "spans", "stream", "derive"]

[[example]]
name = "authorized-request"
required-features = ["iroh", "spans", "stream", "derive"]

[[example]]
name = "bidi"
required-features = ["iroh", "spans", "stream", "derive"]

[[example]]
name = "remote-and-local"
required-features = ["iroh", "spans", "stream", "derive"]

[[example]]
name = "server-actor"
required-features = ["iroh", "spans", "stream", "derive"]

[[example]]
name = "server-shared-state"
required-features = ["iroh", "spans", "stream", "derive"]

[[test]]
name = "span_propagator"
required-features = ["noq_endpoint_setup", "derive", "spans", "span-propagation"]

[workspace]
resolver = "2"
members = ["irpc-derive", "irpc-opentelemetry"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "irpc_docsrs"]

[package.metadata.release]
pre-release-hook = ["git", "cliff", "--unreleased", "--tag", "{{version}}", "--prepend", "CHANGELOG.md"]

[lints.rust]
# Documents which cargo features an API needs. Preview locally with:
# RUSTDOCFLAGS="--cfg irpc_docsrs" cargo +nightly doc --all-features.
# We use our own irpc_docsrs rather than the common docsrs so the cfg
# does not leak into dependencies, some of which fail to build under it.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(irpc_docsrs)"] }

[workspace.dependencies]
anyhow = { version = "1" }
tokio = { version = "1.44", default-features = false }
postcard = { version = "1.1.1", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }
tracing = { version = "0.1.41", default-features = false }
n0-future = { version = "0.3", default-features = false }
n0-error = { version = "1" }
tracing-subscriber = { version = "0.3.23" }
iroh = { version = "1", default-features = false }
noq = { version = "1", default-features = false }
futures-util = { version = "0.3", features = ["sink"] }

[package.metadata.cargo_check_external_types]
allowed_external_types = [
    # workspace crates
    "irpc_derive::rpc_requests",

    # 1.0 crates
    "iroh::*",
    "iroh_base::*",
    "n0_error::*",
    "noq::*",
    "noq_proto::*",
    "postcard::error::Error",
    "serde_core::*",
    "tokio::io::async_read::AsyncRead",
    "tokio::io::async_write::AsyncWrite",
    "tokio::sync::mpsc::bounded::Receiver",
    "tokio::sync::mpsc::bounded::Sender",
    "tokio::sync::oneshot::Receiver",
    "tokio::sync::oneshot::Sender",

    # stable-ish non-1.0 crates that we accept in the public API
    "futures_core::stream::Stream",
    "futures_lite::future::Boxed",
    "futures_sink::Sink",
    # `WithChannels::span`, with the `spans` feature, and `span_propagation::Propagator`.
    # tracing 0.1 has had no breaking release since 2019. Support for a later
    # version would come with its own feature, for example `tracing-02`.
    "tracing::span::Span",
    # `span_propagation::layer` returns a tracing layer, with the `span-propagation` feature
    "tracing_core::subscriber::Subscriber",
    "tracing_subscriber::layer::Layer",
    "tracing_subscriber::registry::LookupSpan",
]
