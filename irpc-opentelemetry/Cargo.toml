[package]
name = "irpc-opentelemetry"
version = "0.1.0"
edition = "2024"
authors = ["n0 team"]
keywords = ["rpc", "opentelemetry", "tracing"]
categories = ["network-programming"]
license = "Apache-2.0/MIT"
repository = "https://github.com/n0-computer/irpc"
description = "OpenTelemetry span propagation for irpc"
rust-version = "1.91"

[dependencies]
irpc = { version = "0.17.0", path = "..", default-features = false, features = ["span-propagation"] }
opentelemetry = "0.32"
tracing = { workspace = true }
tracing-opentelemetry = "0.33"

[dev-dependencies]
anyhow = { workspace = true }
clap = { version = "4.5.41", features = ["derive"] }
# Tests and examples need a crypto provider, which iroh's default features supply.
iroh = { workspace = true, default-features = true }
irpc = { version = "0.17.0", path = "..", features = ["iroh", "derive", "spans"] }
n0-error = { workspace = true }
opentelemetry_sdk = { version = "0.32", features = ["testing"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
rand = "0.10.3"
serde = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }

[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "irpc::*",
    # Re-exported. This crate is 0.x and follows the version of opentelemetry.
    "opentelemetry",
    "tracing_opentelemetry",
]

[package.metadata.release]
# Released on its own: the version follows the opentelemetry releases, not irpc.
shared-version = false
